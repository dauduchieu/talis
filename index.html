<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Talis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    
    <div class="container">
        
        <div class="page home">
            <div class="task-list">
                <!-- <div class="task">
                    <span class="task-name">Vietnamese Poem LLM</span>
                    <span class="task-time">1010·1802</span>
                </div>
                <div class="task">
                    <span class="task-name">Tiny Axiom</span>
                    <span class="task-time"></span>
                </div> -->
                <span>No task</span>
            </div>
        </div>

        <div class="page add hidden">
            <input type="text" id="inp-task-name" placeholder="Task">
            <input type="datetime-local" id="inp-task-datetime">
            <input type="submit" value="Add Task" id="btn-add-task">
        </div>

        <div class="page history hidden">
            <div class="task-list">
                <div class="task">
                    <span class="task-name">Vietnamese Poem LLM</span>
                    <span class="task-time">1010·1802</span>
                    <span>[<span class="task-done-time">1002·1802</span>]</span>
                </div>
                <div class="task">
                    <span class="task-name">Tiny Axiom</span>
                    <span class="task-time"></span>
                    <span>[<span class="task-done-time">1002·1802</span>]</span>
                </div>
            </div>
        </div>

        <div class="page setting hidden">
            <h2>Version <span id="version">1.0.2</span></h2>
            <div>
                <span>LLM Model Name:</span>
                <input type="text" id="inp-llm-model-name" placeholder="gemini-2.5-flash">
            </div>
            <div>
                <span>LLM API Key:</span>
                <input type="text" id="inp-llm-api-key" placeholder="AIxxx">
            </div>
            <div>
                <span>GKey:</span>
                <input type="text" id="inp-g-key" placeholder="gkeyxxx">
            </div>
            <input type="submit" value="Save Settings" id="btn-save-setting">
            <div class="settings-reset">
                <h3>Reset all data</h3>
                <p>This permanently deletes <span style="font-weight: bolder; color: #ff3535;">everything</span>.</p>
                <button type="button" id="btn-reset-all">Generate reset code</button>
                <div class="settings-reset-confirm hidden" id="reset-confirm">
                    <p>Enter this code to continue: <strong id="reset-code"></strong></p>
                    <input type="text" id="inp-reset-code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6-digit code">
                    <button type="button" id="btn-confirm-reset">OK, delete everything</button>
                    <button type="button" id="btn-cancel-reset">Cancel</button>
                </div>
                <p class="settings-reset-status" id="reset-status" role="status" aria-live="polite"></p>
            </div>
        </div>

        <div class="page g hidden">
            <div class="gallery-shell">
                <header class="gallery-header">
                    <div>
                        <!-- <p class="gallery-eyebrow">PRIVATE ARCHIVE</p> -->
                        <h1>Gallery</h1>
                        <!-- <p class="gallery-subtitle">Your images stay on this device.</p> -->
                    </div>
                    <label class="gallery-add-button" for="gallery-file-input">
                        <span aria-hidden="true">+</span>
                        Add images
                    </label>
                    <input id="gallery-file-input" type="file" accept="image/*" multiple hidden>
                </header>
                <div class="gallery-status" id="gallery-status" role="status" aria-live="polite"></div>
                <div class="gallery-grid" id="gallery-grid"></div>
                <div class="gallery-empty hidden" id="gallery-empty">
                    <!-- <span class="gallery-empty-icon" aria-hidden="true">⌁</span>
                    <strong>No images yet</strong>
                    <span>Add a few memories to start your archive.</span> -->
                </div>
            </div>
        </div>

        <div class="gallery-modal hidden" id="gallery-modal" role="dialog" aria-modal="true" aria-labelledby="preview-title">
            <button class="gallery-modal-close" id="preview-close" type="button" aria-label="Close preview">×</button>
            <div class="gallery-preview-frame">
                <img id="preview-image" alt="">
            </div>
            <div class="gallery-preview-details">
                <div>
                    <h2 id="preview-title"></h2>
                    <p id="preview-meta"></p>
                </div>
                <div class="gallery-preview-actions">
                    <button class="gallery-download-button" id="preview-download" type="button">Download</button>
                    <button class="gallery-delete-button" id="preview-delete" type="button">Delete image</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
